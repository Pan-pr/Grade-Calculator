<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Grade & Performance Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- HEADER -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-700">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-3">
          <i class="fa-solid fa-graduation-cap text-blue-500"></i> Live Course Grade Dashboard
        </h1>
        <p class="text-slate-400 text-sm mt-1">Real-time sync from Google Sheets CSV stream.</p>
      </div>
      <div class="flex gap-3">
        <button onclick="fetchSheetData()" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg transition border border-blue-400 flex items-center gap-2">
          <i class="fa-solid fa-rotate" id="refresh-icon"></i> Refresh Data
        </button>
      </div>
    </div>

    <!-- METRICS OVERVIEW -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="glass-card p-5 rounded-2xl">
        <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Estimated Term GPA</div>
        <div class="flex items-baseline justify-between mt-2">
          <span id="overall-gpa" class="text-4xl font-extrabold text-blue-400">0.00</span>
          <span class="text-xs px-2 py-1 bg-blue-500/20 text-blue-300 rounded-md font-medium">19 Credits Total</span>
        </div>
      </div>

      <div class="glass-card p-5 rounded-2xl">
        <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Graded Points Secured</div>
        <div class="flex items-baseline justify-between mt-2">
          <span id="total-points-earned" class="text-3xl font-bold text-emerald-400">0.00</span>
          <span class="text-xs text-slate-400">Total Points</span>
        </div>
      </div>

      <div class="glass-card p-5 rounded-2xl">
        <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Sync Status</div>
        <div class="flex items-baseline justify-between mt-2">
          <span id="sync-status" class="text-sm font-semibold text-emerald-400">Live</span>
          <span id="last-updated" class="text-xs text-slate-400">Just now</span>
        </div>
      </div>

      <div class="glass-card p-5 rounded-2xl">
        <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Satisfactory (S/U)</div>
        <div class="flex items-baseline justify-between mt-2">
          <span class="text-3xl font-bold text-purple-400">Pass (S)</span>
          <span class="text-xs px-2 py-1 bg-purple-500/20 text-purple-300 rounded-md">Gened (3 Cr)</span>
        </div>
      </div>
    </div>

    <!-- CHARTS SECTION -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="glass-card p-6 rounded-2xl lg:col-span-2">
        <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
          <i class="fa-solid fa-chart-bar text-blue-400"></i> Subject Breakdown & Total Score (%)
        </h2>
        <div class="h-64">
          <canvas id="scoresChart"></canvas>
        </div>
      </div>

      <div class="glass-card p-6 rounded-2xl">
        <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
          <i class="fa-solid fa-chart-pie text-purple-400"></i> Credit Distribution
        </h2>
        <div class="h-64 flex justify-center">
          <canvas id="creditChart"></canvas>
        </div>
      </div>
    </div>

    <!-- SUBJECT DETAILED BREAKDOWN -->
    <div class="space-y-6" id="subjects-container"></div>

  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTYQfFvQfk-RzgAoXr71nfa5DjkwgAiQPIXxqKyIrhVu00RF4SKGgfOQnFVRGIN39MxrHNdHUlfhdkW/pubhtml";

    let scoresChart, creditChart;

    function getGradeAndGpa(totalScore, cutoffs) {
      for (const c of cutoffs) {
        if (totalScore >= c.score) {
          return { grade: c.grade, gpa: c.gpa };
        }
      }
      return { grade: "F", gpa: 0.0 };
    }

    function parseCSVData(rows) {
      const subjectsMap = {};
      let currentSubject = null;

      // Define default cutoff maps for standard subjects
      const standardCutoffs = [
        { grade: "A", score: 80, gpa: 4.0 },
        { grade: "B+", score: 75, gpa: 3.5 },
        { grade: "B", score: 70, gpa: 3.0 },
        { grade: "C+", score: 65, gpa: 2.5 },
        { grade: "C", score: 60, gpa: 2.0 },
        { grade: "D+", score: 55, gpa: 1.5 },
        { grade: "D", score: 50, gpa: 1.0 },
        { grade: "F", score: 0, gpa: 0.0 }
      ];

      const physicsCutoffs = [
        { grade: "A", score: 80, gpa: 4.0 },
        { grade: "B+", score: 72, gpa: 3.5 },
        { grade: "B", score: 64, gpa: 3.0 },
        { grade: "C+", score: 56, gpa: 2.5 },
        { grade: "C", score: 48, gpa: 2.0 },
        { grade: "D+", score: 40, gpa: 1.5 },
        { grade: "D", score: 33, gpa: 1.0 },
        { grade: "F", score: 0, gpa: 0.0 }
      ];

      const phyLabCutoffs = [
        { grade: "A", score: 85, gpa: 4.0 },
        { grade: "B+", score: 80, gpa: 3.5 },
        { grade: "B", score: 75, gpa: 3.0 },
        { grade: "C+", score: 70, gpa: 2.5 },
        { grade: "C", score: 65, gpa: 2.0 },
        { grade: "D+", score: 60, gpa: 1.5 },
        { grade: "D", score: 50, gpa: 1.0 },
        { grade: "F", score: 0, gpa: 0.0 }
      ];

      const creditsMap = {
        "Com Prog": 3,
        "Physics I": 3,
        "Calculus I": 3,
        "Comm Eng": 3,
        "Physics Lab": 1,
        "Explore": 3,
        "Phy Lab": 1
      };

      rows.forEach(row => {
        const col0 = row['Subject'] ? row['Subject'].trim() : "";
        const col1 = row['GPA'] ? row['GPA'].trim() : "";
        const col2 = row['Grade'] ? row['Grade'].trim() : "";

        if (col1 === "Score" && col2 === "Full Score") {
          currentSubject = col0;
          if (!subjectsMap[currentSubject]) {
            let cutoffs = standardCutoffs;
            if (currentSubject === "Physics I") cutoffs = physicsCutoffs;
            if (currentSubject === "Phy Lab" || currentSubject === "Physics Lab") cutoffs = phyLabCutoffs;

            subjectsMap[currentSubject] = {
              name: currentSubject,
              credits: creditsMap[currentSubject] || 3,
              assessments: [],
              cutoffs: cutoffs
            };
          }
          return;
        }

        if (currentSubject && col0 && col0 !== "Total" && col0 !== "Grade") {
          const scoreVal = parseFloat(col1) || 0;
          const maxVal = parseFloat(col2) || 0;
          if (maxVal > 0) {
            subjectsMap[currentSubject].assessments.push({
              name: col0,
              score: scoreVal,
              max: maxVal
            });
          }
        }
      });

      return Object.values(subjectsMap);
    }

    function fetchSheetData() {
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('fa-spin');

      Papa.parse(CSV_URL + "&t=" + new Date().getTime(), {
        download: true,
        header: true,
        complete: function(results) {
          icon.classList.remove('fa-spin');
          const parsedSubjects = parseCSVData(results.data);
          renderDashboard(parsedSubjects);
          document.getElementById('last-updated').innerText = new Date().toLocaleTimeString();
        },
        error: function(err) {
          icon.classList.remove('fa-spin');
          alert("Error fetching Google Sheets CSV data.");
        }
      });
    }

    function renderDashboard(subjects) {
      const container = document.getElementById('subjects-container');
      container.innerHTML = '';

      let totalPointsGraded = 0;
      let totalCreditPoints = 0;
      let totalGradedCredits = 0;

      const chartLabels = [];
      const chartScores = [];

      subjects.forEach((subj) => {
        const totalScore = subj.assessments.reduce((sum, a) => sum + Number(a.score), 0);
        const maxScore = subj.assessments.reduce((sum, a) => sum + Number(a.max), 0);
        const { grade, gpa } = getGradeAndGpa(totalScore, subj.cutoffs);

        totalPointsGraded += totalScore;
        totalCreditPoints += gpa * subj.credits;
        totalGradedCredits += subj.credits;

        chartLabels.push(subj.name);
        chartScores.push(totalScore);

        // Next Grade Threshold calculation
        let nextGradeText = "Max Grade Reached";
        const sortedCutoffs = [...subj.cutoffs].sort((a,b) => b.score - a.score);
        const currentIdx = sortedCutoffs.findIndex(c => totalScore >= c.score);
        if (currentIdx > 0) {
          const nextGrade = sortedCutoffs[currentIdx - 1];
          const needed = (nextGrade.score - totalScore).toFixed(2);
          nextGradeText = `Needs <b class="text-blue-400">+${needed} pts</b> for <b class="text-emerald-400">${nextGrade.grade}</b>`;
        }

        const cardHtml = `
          <div class="glass-card rounded-2xl p-6 transition">
            <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-700/60 pb-4 mb-4 gap-4">
              <div>
                <div class="flex items-center gap-3">
                  <h3 class="text-xl font-bold text-white">${subj.name}</h3>
                  <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-700 text-slate-300 font-medium">${subj.credits} Credits</span>
                </div>
                <div class="text-xs text-slate-400 mt-1">${nextGradeText}</div>
              </div>

              <div class="flex items-center gap-6">
                <div class="text-right">
                  <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Total Score</div>
                  <div class="text-2xl font-bold text-white">${totalScore.toFixed(2)} <span class="text-xs text-slate-400">/ ${maxScore}</span></div>
                </div>
                <div class="text-right">
                  <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Predicted Grade</div>
                  <div class="text-2xl font-extrabold ${gpa >= 3 ? 'text-emerald-400' : gpa >= 2 ? 'text-amber-400' : 'text-rose-400'}">
                    ${grade} <span class="text-sm font-normal text-slate-400">(${gpa.toFixed(1)})</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm text-slate-300">
                <thead class="bg-slate-800/60 text-slate-400 uppercase text-xs">
                  <tr>
                    <th class="py-2.5 px-3 rounded-l-lg">Assessment Item</th>
                    <th class="py-2.5 px-3">Score Earned</th>
                    <th class="py-2.5 px-3">Full Score</th>
                    <th class="py-2.5 px-3 rounded-r-lg">Progress</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-700/40">
                  ${subj.assessments.map((item) => `
                    <tr>
                      <td class="py-2 px-3 font-medium text-slate-200">${item.name}</td>
                      <td class="py-2 px-3 text-white font-semibold">${item.score}</td>
                      <td class="py-2 px-3 text-slate-400">${item.max}</td>
                      <td class="py-2 px-3">
                        <div class="w-full bg-slate-700 rounded-full h-2 max-w-xs">
                          <div class="bg-blue-500 h-2 rounded-full" style="width: ${item.max > 0 ? (item.score / item.max) * 100 : 0}%"></div>
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });

      const overallGpa = totalGradedCredits > 0 ? (totalCreditPoints / totalGradedCredits).toFixed(2) : "0.00";
      document.getElementById('overall-gpa').innerText = overallGpa;
      document.getElementById('total-points-earned').innerText = totalPointsGraded.toFixed(2);

      updateCharts(chartLabels, chartScores, subjects.map(s => s.credits));
    }

    function initCharts() {
      const ctx1 = document.getElementById('scoresChart').getContext('2d');
      scoresChart = new Chart(ctx1, {
        type: 'bar',
        data: { labels: [], datasets: [{ label: 'Total Score Achieved', data: [], backgroundColor: '#3b82f6', borderRadius: 6 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
            x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
          },
          plugins: { legend: { display: false } }
        }
      });

      const ctx2 = document.getElementById('creditChart').getContext('2d');
      creditChart = new Chart(ctx2, {
        type: 'doughnut',
        data: { labels: [], datasets: [{ data: [], backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#6366f1'] }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', boxWidth: 12 } } }
        }
      });
    }

    function updateCharts(labels, scores, credits) {
      if (scoresChart) {
        scoresChart.data.labels = labels;
        scoresChart.data.datasets[0].data = scores;
        scoresChart.update();
      }
      if (creditChart) {
        creditChart.data.labels = labels;
        creditChart.data.datasets[0].data = credits;
        creditChart.update();
      }
    }

    window.onload = () => {
      initCharts();
      fetchSheetData();
    };
  </script>
</body>
</html>
